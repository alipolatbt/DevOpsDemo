name: GKE Deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test src/DevOpsDemo/DevOpsDemo.csproj
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.adanzyedevops }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: devops-lab
          location: europe-west3-b
      - name: Build and push
        shell: bash
        run: |
          gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet
          IMAGE="europe-west3-docker.pkg.dev/${{ vars.adanzyedevops }}/devops-images/devops-demo:sha-${GITHUB_SHA::7}"
          docker build -t "$IMAGE" src/DevOpsDemo
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy
        run: |
          kubectl apply -f k8s/base/configmap.yaml
          kubectl apply -f k8s/base/service.yaml
          kubectl apply -f k8s/base/ingress.yaml
          kubectl -n dev set image deployment/devops-demo app="$IMAGE"
          kubectl -n dev rollout status deployment/devops-demo --timeout=180s
